spec_version: data_spec_v1
prompt_version: mirror_v2
prompt_path: src/forge/generation/prompts/mirror_v2.txt

target: 400000            # one mirror per training human document
assignment: round_robin   # over held_in families only

validation:
  length_ratio_min: 0.6
  length_ratio_max: 1.6
  reject_assistant_preamble: true
  max_minhash_jaccard_to_source: 0.5
  max_retries: 2

attribute_extraction:
  fields: [topic, genre, register, target_tokens, structure, difficulty, key_anchors]
  key_anchors_min: 3
  key_anchors_max: 6
  # Extraction must paraphrase, never copy sentences. Copied surface text would let
  # the classifier learn copy-detection instead of a generation-process signal.
  verbatim_copy_forbidden: true
