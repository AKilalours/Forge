# Stage 1: human + matched AI mirrors. This is the run that produces FORGE's first
# real numbers.
spec_version: data_spec_v1
experiment: { id: forge_exp_010_minimal, stage: mirror }
model_config: configs/models/forge_base.yaml
output_dir: outputs/forge_exp_010_minimal
fpr_budget: 0.01        # 1%, not 0.1%: at 15k eval documents a 0.1% budget is not
                        # resolvable, and reporting an unresolvable number is worse
                        # than reporting a looser one honestly. See lab.min_humans_for_fpr.

data:
  dataset_version: v0.1-minimal
  human_root: data/silver
  mirror_root: data/silver/mirrors

training:
  batch_size: 32
  grad_accum: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  epochs: 3
  seed: 42
  precision: bf16
  # On here, deliberately, and it is the slower setting: +24.15% step time for 17.74 GiB
  # saved, measured in reports/experiments/profile/train_step_comparison.json. The minimal
  # configs are the reproduce-on-a-modest-GPU path, so they buy the memory. The full-scale
  # configs (baseline.yaml, mirror.yaml) turn it off.
  gradient_checkpointing: true

distributed: { strategy: none }
tracking: { backend: wandb, project: forge }
