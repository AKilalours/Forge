# Minimal-scale mirror arm. Budget held EQUAL across arms: any improvement must come
# from WHICH data, not HOW MUCH. See docs/evaluation.md.
spec_version: data_spec_v1
experiment: { id: forge_min_mirror, stage: mirror }
model_config: configs/models/forge_base.yaml
fpr_budget: 0.001

paths:
  human: data/silver
  ai: data/silver/mirrors          # THIS ARM'S AI SOURCE. Each arm must differ.
  mixed: data/silver/mixed
  out: outputs

data:
  dataset_version: v0.2-min
  # EQUAL BUDGET. Each arm's validator rejects at its own rate, so generation yields
  # different accepted counts. Set this to the SMALLER arm's count, identically in every
  # arm's config, before training. Left null the comparison measures data volume as much
  # as data strategy. Fill it in from the generation stats, do not guess.
  # Counted from the parquet with pyarrow, not from the log, because a log records what
  # the generator believed and the parquet records what landed. Regenerated corpus,
  # dataset v0.2-min, chat template and words prompt: random accepted 19,992 documents
  # (phi 5055, falcon 5045, qwen 4992, smollm 4900) and mirrors accepted 19,736 (phi
  # 5113, smollm 4971, falcon 4880, qwen 4772). The smaller arm sets the budget for both.
  #
  # THE PREVIOUS VALUE WAS 20,000, WHICH IS NOT THE SMALLER ARM'S COUNT. It was a round
  # number chosen before either arm had been counted, and at 20,000 the control arm would
  # have trained on 19,992 documents against the mirror arm's 19,736: a 256-document
  # advantage to one arm, small enough to look like nothing and pointing the same way as
  # the result. The rule in this comment existed; it just had not been applied to the
  # numbers that actually came out.
  ai_cap: 19736
  human_cap: 20000
  # LENGTH MATCHING, against the HUMAN corpus. The comment here used to say "point both
  # arms at the MIRROR arm's directory", describing an earlier design, while the value
  # said `human`. Both arms' AI pools are resampled by cap_documents_matching so their
  # word-count histogram tracks the human corpus's.
  #
  # This is what handles the length gap measured on the regenerated corpus: AI ran a
  # median of 296 words against the human corpus's 257, about 15% long, at every
  # percentile. Both arms pass through the same validator so the ARM COMPARISON was never
  # at risk, but an unmatched AI pool lets the detector learn length instead of learning
  # AI, which would inflate the absolute numbers against human text.
  ai_reference: human
  arm: mirror              # verified against prompt_version at load

training:
  batch_size: 32
  grad_accum: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  epochs: 2
  seed: 42
  precision: bf16
  # On here, deliberately, and it is the slower setting: +24.15% step time for 17.74 GiB
  # saved, measured in reports/experiments/profile/train_step_comparison.json. The minimal
  # configs are the reproduce-on-a-modest-GPU path, so they buy the memory. The full-scale
  # configs (baseline.yaml, mirror.yaml) turn it off.
  gradient_checkpointing: true
  token_loss_weight: 0.5
  num_workers: 4
  log_every: 50

distributed: { strategy: none }
tracking: { backend: wandb, project: forge }
