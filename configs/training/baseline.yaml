# Stage 0. Human + randomly generated AI. This is the number every later stage must beat.
spec_version: data_spec_v1
experiment: { id: forge_exp_000, stage: baseline }
model_config: configs/models/forge_base.yaml
data: { dataset_version: v0.1, include: [human, ai_random] }
training:
  batch_size: 32
  grad_accum: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  epochs: 3
  seed: 42
  precision: bf16
  # MEASURED, not assumed. scripts/profile_train_step.py on an A100-SXM4-80GB at these
  # exact shapes (batch 32, seq 512, bf16, deberta-v3-base): checkpointing on is 585.81 ms
  # per step and 4.94 GiB peak; off is 471.84 ms and 22.68 GiB. It costs +24.15% step time
  # to save 17.74 GiB, and 22.68 GiB is not a number an 80 GB card has to care about.
  # Off here. Needs a >=40 GiB card. See reports/experiments/profile/train_step_comparison.json.
  gradient_checkpointing: false
distributed: { strategy: none }
tracking: { backend: wandb, project: forge }
