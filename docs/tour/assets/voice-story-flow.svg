<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Voice Story product preview</title>
  <desc id="desc">An illustrative preview of the deployed Forge Voice Story form. A writer chooses an exact excerpt, writes their own reflections, and exports a narrated keepsake.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#080d12"/></linearGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f1d59c"/><stop offset="1" stop-color="#bc9460"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1440" height="920" fill="url(#bg)"/>
  <circle cx="1240" cy="130" r="270" fill="#294143" opacity=".16"/>
  <circle cx="110" cy="850" r="260" fill="#8e7040" opacity=".08"/>
  <text x="82" y="76" fill="#76d5b0" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">FORGE · VOICE STORY</text>
  <text x="82" y="144" fill="#f5f2e8" font-family="Georgia,serif" font-size="50">A voice, kept.</text>
  <text x="84" y="184" fill="#aab7c0" font-family="Arial,sans-serif" font-size="20">The important part is the meaning only you can add.</text>
  <rect x="82" y="222" width="1276" height="76" rx="18" fill="#111a22" stroke="#2b3942"/>
  <circle cx="126" cy="260" r="18" fill="#76d5b0"/><text x="120" y="267" fill="#07110e" font-family="Arial,sans-serif" font-size="18" font-weight="700">1</text>
  <text x="160" y="253" fill="#eee9dd" font-family="Arial,sans-serif" font-size="18" font-weight="700">Choose a line</text>
  <text x="160" y="277" fill="#91a0a9" font-family="Arial,sans-serif" font-size="14">Exact words from your writing</text>
  <path d="M480 260h90" stroke="#45545a" stroke-width="2"/><circle cx="620" cy="260" r="18" fill="#d9c28e"/><text x="614" y="267" fill="#191710" font-family="Arial,sans-serif" font-size="18" font-weight="700">2</text>
  <text x="654" y="253" fill="#eee9dd" font-family="Arial,sans-serif" font-size="18" font-weight="700">Add your meaning</text>
  <text x="654" y="277" fill="#91a0a9" font-family="Arial,sans-serif" font-size="14">Detail · intention · note</text>
  <path d="M975 260h90" stroke="#45545a" stroke-width="2"/><circle cx="1114" cy="260" r="18" fill="#54636a"/><text x="1108" y="267" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">3</text>
  <text x="1148" y="253" fill="#eee9dd" font-family="Arial,sans-serif" font-size="18" font-weight="700">Keep it</text>
  <text x="1148" y="277" fill="#91a0a9" font-family="Arial,sans-serif" font-size="14">Offline narrated keepsake</text>
  <rect x="82" y="330" width="1276" height="510" rx="24" fill="#111820" stroke="#32414a" filter="url(#shadow)"/>
  <text x="120" y="382" fill="#a9bdc3" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">YOUR WRITING</text>
  <text x="120" y="426" fill="#e9e6dc" font-family="Georgia,serif" font-size="21">The last table at the corner was always the one my mother chose.</text>
  <text x="120" y="458" fill="#c6c9c0" font-family="Georgia,serif" font-size="19">It faced the window, where the afternoon light reached the chipped blue cup</text>
  <text x="120" y="488" fill="#c6c9c0" font-family="Georgia,serif" font-size="19">she carried from home. She never said the cup was special; she just kept bringing it.</text>
  <rect x="120" y="526" width="1198" height="82" rx="14" fill="#242920" stroke="#73674c"/>
  <rect x="120" y="526" width="4" height="82" rx="2" fill="url(#gold)"/>
  <text x="148" y="558" fill="#c8b17d" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">THE LINE YOU CHOSE · EXACT EXCERPT</text>
  <text x="148" y="587" fill="#f4eee0" font-family="Georgia,serif" font-size="20">“The chipped blue cup she carried from home.”</text>
  <text x="120" y="653" fill="#e1d3ad" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">WHAT SMALL DETAIL DO YOU REMEMBER MOST CLEARLY?</text>
  <rect x="120" y="670" width="574" height="60" rx="12" fill="#0c1217" stroke="#34424a"/>
  <text x="144" y="707" fill="#bdc5c1" font-family="Georgia,serif" font-size="17">The chipped rim warming my hands in the late sun…</text>
  <text x="726" y="653" fill="#e1d3ad" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">WHAT DID YOU HOPE SOMEONE WOULD FEEL?</text>
  <rect x="726" y="670" width="592" height="60" rx="12" fill="#0c1217" stroke="#34424a"/>
  <text x="750" y="707" fill="#bdc5c1" font-family="Georgia,serif" font-size="17">That a small ritual can keep a conversation alive…</text>
  <text x="120" y="786" fill="#829198" font-family="Arial,sans-serif" font-size="14">Illustrative product preview · the live app builds the complete story and download.</text>
  <rect x="1010" y="756" width="308" height="54" rx="14" fill="url(#gold)"/>
  <text x="1040" y="790" fill="#171711" font-family="Arial,sans-serif" font-size="15" font-weight="700">CREATE MY VOICE STORY  →</text>
</svg>
