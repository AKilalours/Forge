.8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#f97316" text-anchor="middle" font-weight="600">2.64</text><text x="594.7" y="282.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400">4 partitions</text><text x="58.0" y="326.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#8b949e" text-anchor="start" font-weight="400">Spark reports a 1.09x speedup here and Beam reports 3.29x. This is why the ratio is never published alone.</text></svg>
