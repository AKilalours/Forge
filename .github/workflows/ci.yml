name: ci

on:
  # This said [main]. The repository's only branch, and its default, is master, so
  # this workflow existed, showed as active, was cited in docs/jd_coverage.md as the
  # evidence that DevOps is implemented, and never ran once. Both names are listed now
  # so a later rename cannot silently switch it off again.
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor that requires-python promises, and the version actually developed
        # on. Testing only 3.10 while the README badges 3.12 means neither claim was
        # ever checked against the other.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # serve is installed so tests/unit/test_forge_app.py actually RUNS here.
      # With only [dev], fastapi is absent, the module skips itself, and CI goes
      # green on a file that never executed.
      - run: pip install -e ".[dev,serve]"
      # scripts/ is in scope because it is not scratch: eval_ood.py produced the
      # published benchmark numbers and check_readme_claims.py is a gate below.
      - run: ruff check src tests scripts
      - run: pytest --cov=forge --cov-report=term-missing
      # Published numbers must still match the artifacts that produced them.
      - run: python scripts/check_readme_claims.py

  # SEPARATE JOB, ON PURPOSE. tests/unit/test_flywheel_dag.py guards itself with
  # importorskip("airflow"), and the main test job installs [dev,serve]. Left alone the DAG
  # tests would SKIP in CI and the job would go green: exactly how
  # tests/unit/test_forge_app.py went unrun for months, rediscovered this morning.
  #
  # Airflow is a heavy install with its own pin graph, so adding it to the matrix would
  # slow every run and risk resolver conflicts with the model stack. Its own job keeps the
  # matrix fast AND keeps these tests from quietly not running.
  dag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,orchestration]"
      - run: ruff check orchestration
      - run: pytest -q -ra tests/unit/test_flywheel_dag.py

  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      # Fails the build if any config drifts from the frozen Data Spec v1.
      - run: python -m forge.cli spec-check
