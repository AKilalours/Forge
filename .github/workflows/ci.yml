name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # serve is installed so tests/unit/test_forge_app.py actually RUNS here.
      # With only [dev], fastapi is absent, the module skips itself, and CI goes
      # green on a file that never executed.
      - run: pip install -e ".[dev,serve]"
      - run: ruff check src tests
      - run: pytest --cov=forge --cov-report=term-missing
      # Published numbers must still match the artifacts that produced them.
      - run: python scripts/check_readme_claims.py

  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      # Fails the build if any config drifts from the frozen Data Spec v1.
      - run: python -m forge.cli spec-check
