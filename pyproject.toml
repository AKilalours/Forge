[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "FORGE: Failure-Driven Synthetic Data Generation for Robust AI-Content Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Akila Lourdes Miriyala Francis" }]

dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "polars>=0.20",
  "pandas>=2.2",
]

[project.optional-dependencies]
# Phase 1: ingestion and cleaning
data = [
  "datasets>=2.18",
  # Pinned below 1.0 for the same reason transformers is pinned below 5: transformers 4.x
  # requires huggingface-hub<1.0, and `pip install -U huggingface_hub` cheerfully installs
  # 1.x and leaves the environment in a state pip itself reports as broken.
  "huggingface-hub>=0.22,<1.0",
  "fasttext-langdetect>=1.0",
  "ftfy>=6.2",
  "selectolax>=0.3",
  "datasketch>=1.6",
  "presidio-analyzer>=2.2",
]
# FORGE-IMAGE: see docs/image_spec_v1.md
image = [
  "pillow>=10.0",
]
# Phase 2 and 3: generation and training
train = [
  "torch>=2.3",
  # Same pin as `serve`: the checkpoints and their thresholds belong to 4.x tokenisation,
  # so training and serving must not drift apart on the tokeniser.
  "transformers>=4.40,<5",
  "accelerate>=0.29",
  "sentencepiece>=0.2",
  "scikit-learn>=1.4",
  "wandb>=0.16",
]
# Phase 4: hard negative mining and failure atlas
mining = [
  "sentence-transformers>=2.7",
  "hdbscan>=0.8.33",
  "umap-learn>=0.5",
]
# Phase 7: distributed training
dist = [
  "ray[default,train]>=2.10",
  "deepspeed>=0.14",
]
# Phase 8: serving, monitoring, orchestration
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  # /v1/image/analyze takes an UploadFile. FastAPI raises at import time, not at request
  # time, when this is absent, so omitting it does not degrade the app: it stops it booting.
  "python-multipart>=0.0.9",
  # The image path decodes every upload with Pillow. It is also in the `image` extra; the
  # server cannot run without it, so it is a hard serve dependency too.
  "pillow>=10.0",
  # SERVING NEEDS THE MODEL STACK. These were declared only under `train`, on the reasoning
  # that torch is a training dependency. It is not: forge.inference.scorer loads the text
  # arms with it, forge.image.detector loads the visual detector with it, and
  # forge.image.attribution runs the occlusion pass with it. Installing only `.[serve]`
  # therefore produced a server whose every detector reported "not loaded", with the app
  # itself booting fine, which is the hardest version of this failure to diagnose.
  "torch>=2.3",
  # PINNED BELOW 5. The arms were trained and evaluated on transformers 4.x. Version 5
  # rewrote tokenizer construction: it no longer builds a DeBERTa-v3 tokenizer from the
  # SentencePiece model directly and falls back to a TikToken converter, which changes the
  # tokenizer for a checkpoint whose thresholds were fitted under the old one. A detection
  # threshold is only meaningful against the tokenisation it was measured with, so this
  # stays pinned until the arms are re-evaluated on 5.x and the numbers are recorded.
  "transformers>=4.40,<5",
  # The DeBERTa-v3 backbone tokenizer IS a SentencePiece model. Without this, transformers
  # falls back to a converter that needs tiktoken, and loading the tokenizer fails, so the
  # text detector reports unavailable on a machine that has torch and transformers. It was
  # declared only under `train`, where it looks like a training-time need. It is not.
  "sentencepiece>=0.2",
  "onnxruntime>=1.17",
  "prometheus-client>=0.20",
  "boto3>=1.34",
]
orchestration = [
  "apache-airflow>=2.9",
  "pyspark>=3.5",
]
# The Streamlit deployment. Streamlit Community Cloud is the only free host that runs a
# torch app without a payment card, so streamlit_app.py is the deployed interface and
# api/forge_app.py stays the reference one.
demo = [
  "streamlit>=1.36",
]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  # Upper bound deliberate. An unbounded linter pin means CI breaks on the
  # linter's release schedule rather than on a change to this repo: ruff 0.16
  # reported 109 errors against code that was clean under the 0.4 this range
  # originally resolved to. Bump this on purpose, and fix what the bump finds.
  "ruff>=0.16,<0.17",
  "mypy>=1.9",
  "pre-commit>=3.7",
]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  # B008 exists to catch a MUTABLE default shared across calls. Every default this
  # repo passes is a frozen dataclass (LengthPolicy, QualityPolicy, LshParams,
  # ValidationPolicy, SelectionPolicy, GenerationSpec, ValidityPolicy), so no caller
  # can mutate the shared instance and the failure the rule guards against cannot
  # happen. SelectionPolicy was the one exception and is now frozen too, which is
  # what makes this blanket ignore honest rather than convenient.
  "B008",
  # Line length is enforced by [tool.ruff] line-length for formatting, not as a
  # lint error; wrapping a dense numeric expression to satisfy it usually makes it
  # harder to read.
  "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra reports the skip reasons in the summary. Without it a module that skips
# itself on a missing optional dependency is invisible, which is how
# tests/unit/test_forge_app.py stayed dead in CI while CI stayed green.
addopts = "-q -ra"
# The repo root, so `from api.forge_app import ...` resolves. Only src/forge is
# an installed package (see tool.setuptools.packages.find), and api/ is a
# top-level directory rather than a package, so without this pytest puts
# tests/unit on sys.path and never the root.
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
